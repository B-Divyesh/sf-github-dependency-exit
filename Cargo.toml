[package]
name = "github-exit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Inventory the GitHub dependencies that make a repository move costly"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-github-dependency-exit"
include = [
  "/src/**",
  "/tests/**",
  "/examples/**",
  "/Cargo.toml",
  "/Cargo.lock",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]

[[bin]]
name = "github-exit"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
claim-test-hook = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
